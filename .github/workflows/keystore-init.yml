name: Keystore Init (run once)

on:
  workflow_dispatch:
    inputs:
      alias:
        description: Key alias
        required: false
        default: termuxglibc
      storepass:
        description: Keystore password (min 6 chars)
        required: true
      keypass:
        description: Key password (min 6 chars)
        required: true

jobs:
  generate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Generate fixed release keystore
        run: |
          sudo apt-get update && sudo apt-get install -y openjdk-17-jre-headless
          STOREPASS='${{ inputs.storepass }}' KEYPASS='${{ inputs.keypass }}' \
            ALIAS='${{ inputs.alias }}' bash scripts/generate-keystore.sh release.keystore
          base64 -w0 release.keystore > release.keystore.b64
          echo "Upload release.keystore.b64 as artifact, then add GitHub Secrets:"
          echo "KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
          ls -lh release.keystore*

      - uses: actions/upload-artifact@v4
        with:
          name: new-keystore
          path: |
            release.keystore.b64
          retention-days: 7
