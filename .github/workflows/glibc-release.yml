name: Glibc Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  language-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check English only, no emoji (fork files)
        run: bash scripts/check-english.sh

  bootstrap-aarch64:
    runs-on: ubuntu-22.04
    needs: language-check
    steps:
      - uses: actions/checkout@v4
      - name: Build glibc sysroot (aarch64)
        run: bash glibc/build.sh aarch64
        env:
          WORKDIR: /tmp/glibc-build
          SYSROOT: /tmp/glibc-sysroot-aarch64
      - name: Assemble glibc bootstrap zip
        run: |
          bash scripts/make-bootstrap.sh /tmp/glibc-sysroot-aarch64 glibc-bootstrap-aarch64.zip aarch64
          sha256sum glibc-bootstrap-aarch64.zip | tee glibc-bootstrap-aarch64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: glibc-bootstrap-aarch64
          path: |
            glibc-bootstrap-aarch64.zip
            glibc-bootstrap-aarch64.zip.sha256

  bootstrap-arm:
    runs-on: ubuntu-22.04
    needs: language-check
    steps:
      - uses: actions/checkout@v4
      - name: Build glibc sysroot (arm)
        run: bash glibc/build.sh arm
        env:
          WORKDIR: /tmp/glibc-build
          SYSROOT: /tmp/glibc-sysroot-arm
      - name: Assemble glibc bootstrap zip
        run: |
          bash scripts/make-bootstrap.sh /tmp/glibc-sysroot-arm glibc-bootstrap-arm.zip arm
          sha256sum glibc-bootstrap-arm.zip | tee glibc-bootstrap-arm.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: glibc-bootstrap-arm
          path: |
            glibc-bootstrap-arm.zip
            glibc-bootstrap-arm.zip.sha256

  build-apk:
    runs-on: ubuntu-latest
    needs: [bootstrap-aarch64, bootstrap-arm]
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compute version
        id: version
        run: |
          echo "code=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "name=0.118.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "tag=v0.118.${GITHUB_RUN_NUMBER}-apt-android-7-glibc-release" >> "$GITHUB_OUTPUT"

      - name: Restore fixed keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          ls -lh "$GITHUB_WORKSPACE/release.keystore"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build signed release APKs (arm64-v8a + armeabi-v7a)
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: 1
          TERMUX_APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          TERMUX_APK_VERSION_TAG: ${{ steps.version.outputs.tag }}
          TERMUX_APK_VERSION_CODE: ${{ steps.version.outputs.code }}
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Validate split APKs
        run: |
          ls -lh app/build/outputs/apk/release/
          test -f "app/build/outputs/apk/release/termux-glibc_${{ steps.version.outputs.tag }}_arm64-v8a.apk"
          test -f "app/build/outputs/apk/release/termux-glibc_${{ steps.version.outputs.tag }}_armeabi-v7a.apk"

      - name: Collect and checksum APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          (cd dist && sha256sum *.apk | tee ../apk.sha256)
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            dist/*.apk
            apk.sha256

  release:
    runs-on: ubuntu-22.04
    needs: [build-apk, bootstrap-aarch64, bootstrap-arm]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: glibc-bootstrap-aarch64
          path: ./release-assets

      - uses: actions/download-artifact@v4
        with:
          name: glibc-bootstrap-arm
          path: ./release-assets

      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: ./release-assets

      - name: Prepare release assets
        run: |
          ls -R ./release-assets
          mkdir -p ./out
          find ./release-assets -name '*.apk' -exec cp {} ./out/ \;
          find ./release-assets -name '*.zip*' -exec cp {} ./out/ \;
          find ./release-assets -name '*.sha256' -exec cp {} ./out/ \;
          ls -lh ./out/
          (cd ./out && sha256sum * | tee ../CHECKSUMS.txt)
          cp ../CHECKSUMS.txt ./out/CHECKSUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.118.${{ github.run_number }}
          name: v0.118.${{ github.run_number }}
          body: |
            TermuxGlibc release v0.118.${{ github.run_number }} (Termux fork + native glibc).

            Signed release build with fixed keystore.
            - termux-glibc_*_arm64-v8a.apk (64-bit)
            - termux-glibc_*_armeabi-v7a.apk (32-bit)
            - glibc-bootstrap-aarch64.zip + glibc-bootstrap-arm.zip (glibc sysroot, no proot)
            - CHECKSUMS.txt

            Minimum Android 9 (API 28). Package: com.termux.glibc.
          draft: false
          prerelease: false
          files: |
            ./out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
